[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    ".git",
    "__pycache__",
    "venv",
    ".venv",
    "migrations",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "DJ"]
ignore = ["E501", "E203"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"